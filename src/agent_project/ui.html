<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085;
    --border: #e2e5eb; --accent: #2f5bd3; --accent-text: #ffffff;
    --ok: #1d7a46; --ok-bg: #e5f4ec; --warn: #9a5b00; --warn-bg: #fdf1dc;
    --err: #b42318; --err-bg: #fde8e6; --code-bg: #f1f3f6; --chip: #eef1f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #98a1b3;
      --border: #2a303b; --accent: #7a9cff; --accent-text: #0e1220;
      --ok: #6fd69c; --ok-bg: #16301f; --warn: #f2b45a; --warn-bg: #33270f;
      --err: #ff8a80; --err-bg: #3a1a18; --code-bg: #141821; --chip: #252b36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: var(--panel); display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .layout {
    display: grid; grid-template-columns: 260px 1fr; gap: 20px;
    padding: 20px 24px; max-width: 1200px; margin: 0 auto;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    header { padding: 12px 16px; }
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 10px;
  }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li button {
    width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 7px 8px; border-radius: 6px; cursor: pointer; font: inherit;
    font-size: 13px; overflow-wrap: anywhere;
  }
  aside li button:hover { background: var(--chip); }
  aside li button.active { background: var(--accent); color: var(--accent-text); }
  aside .folder { color: var(--muted); font-size: 11px; display: block; }
  aside .empty { color: var(--muted); font-size: 13px; }
  textarea {
    width: 100%; min-height: 80px; resize: vertical; font: inherit;
    padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row label { font-size: 13px; color: var(--muted); }
  input[type=number] {
    width: 64px; padding: 6px 8px; font: inherit; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button.primary {
    background: var(--accent); color: var(--accent-text); border: 0;
    border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  .note { font-size: 12px; color: var(--muted); }
  .message { margin-top: 10px; font-size: 13px; color: var(--err); }
  main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.err { background: var(--err-bg); color: var(--err); }
  .goal { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .step { border-left: 3px solid var(--border); padding-left: 14px; }
  .step-head {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    font-size: 13px; color: var(--muted);
  }
  .step-head strong { color: var(--text); font-size: 14px; }
  .call { margin-top: 8px; }
  .call code {
    background: var(--chip); padding: 2px 6px; border-radius: 5px;
    font-size: 13px; overflow-wrap: anywhere;
  }
  .result { margin-top: 6px; font-size: 13px; }
  .model-text { margin: 6px 0 0; font-style: italic; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
  pre {
    background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto;
    font-size: 12px; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 6px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .table-wrap { overflow-x: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .final h3 { margin: 0 0 6px; font-size: 15px; }
  .final p { white-space: pre-wrap; margin: 8px 0 0; }
  .placeholder { color: var(--muted); text-align: center; padding: 40px 16px; }
  .spinner {
    width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    display: inline-block; animation: spin .8s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Job Search Agent</h1>
  <span>trace viewer</span>
</header>
<div class="layout">
  <aside class="panel">
    <h2>Traces</h2>
    <ul id="trace-list"><li class="empty">Loading…</li></ul>
  </aside>
  <main>
    <section class="panel">
      <h2>New run</h2>
      <textarea id="goal" aria-label="Goal"></textarea>
      <div class="row">
        <label for="max-steps">Max steps</label>
        <input id="max-steps" type="number" min="1">
        <button id="run" class="primary">Run agent</button>
        <span class="note">Live run, uses API credit.</span>
      </div>
      <div id="message" class="message" hidden></div>
    </section>
    <section id="view">
      <div class="panel placeholder">Choose a trace on the left or start a new run.</div>
    </section>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function fmtArgs(raw) {
  try { return JSON.stringify(JSON.parse(raw || "{}")); } catch { return String(raw); }
}
const fmtCost = (v) => "USD " + Number(v || 0).toFixed(6);

let selected = null;
let pollTimer = null;

async function getJSON(url, options) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw Object.assign(new Error(data.message || data.error), { data });
  return data;
}

async function loadList() {
  const list = $("trace-list");
  const traces = await getJSON("/api/traces");
  list.replaceChildren();
  if (!traces.length) list.append(el("li", { class: "empty" }, "No traces yet."));
  for (const t of traces) {
    const active = selected && selected.folder === t.folder && selected.name === t.name;
    const button = el("button", { class: active ? "active" : "" },
      el("span", { class: "folder" }, t.folder), t.name);
    button.onclick = () => openTrace(t.folder, t.name);
    list.append(el("li", {}, button));
  }
}

async function openTrace(folder, name, live = false) {
  clearTimeout(pollTimer);
  selected = { folder, name };
  loadList();
  const url = `/api/trace?folder=${encodeURIComponent(folder)}&name=${encodeURIComponent(name)}`;
  let events = [];
  try { events = await getJSON(url); } catch { if (!live) return; }
  render(events, live);
  const finished = events.some((e) => e.event === "run_finished");
  if (live && !finished) {
    pollTimer = setTimeout(() => openTrace(folder, name, true), 700);
  } else if (live) {
    $("run").disabled = false;
    loadList();
  }
}

function resultView(name, result) {
  const status = result.ok
    ? el("span", { class: "badge ok" }, "ok")
    : el("span", { class: "badge err" }, result.error || "error");
  const parts = [status];

  if (name === "check_match" && result.ok) {
    const rows = result.results.map((r) => r.error
      ? el("tr", {}, el("td", {}, r.offer_id), el("td", { colspan: 4 }, r.error))
      : el("tr", {},
          el("td", {}, r.offer_id),
          el("td", {}, r.title),
          el("td", {}, r.is_full_match ? "✅" : "—"),
          el("td", {}, r.already_applied ? "applied" : ""),
          el("td", {}, r.missing_skills.join(", ") ||
            Object.entries(r.checks).filter(([, ok]) => !ok).map(([k]) => k).join(", "))));
    parts.push(el("div", { class: "table-wrap" }, el("table", {},
      el("tr", {}, ["Offer", "Title", "Full match", "Status", "Missing / failed"]
        .map((h) => el("th", {}, h))), rows)));
  } else if (name === "search_offers" && result.ok) {
    parts.push(` ${result.offers.length} of ${result.total_found} shown`);
    parts.push(el("div", { class: "chips" },
      result.offers.map((o) => el("span", { class: "chip" }, `${o.id} · ${o.title} · ${o.location}`))));
  } else if (name === "final_answer" && result.ok) {
    parts.push(" accepted by check_final");
  } else if (result.problems) {
    parts.push(el("div", { class: "chips" },
      result.problems.map((p) => el("span", { class: "chip" }, `${p.offer_id || ""} ${p.problem}`))));
  }
  parts.push(el("details", {}, el("summary", {}, "raw result"),
    el("pre", {}, JSON.stringify(result, null, 2))));
  return el("div", { class: "result" }, parts);
}

function render(events, live) {
  const view = $("view");
  const start = events.find((e) => e.event === "run_started");
  const end = events.find((e) => e.event === "run_finished");
  const titles = {};
  const blocks = [];
  let cost = 0, latency = 0, steps = 0;
  let current = null;

  for (const { event, payload: p } of events) {
    if (event === "model_response") {
      steps = p.step; cost = p.total_cost_usd ?? cost + (p.cost_usd || 0);
      latency += p.latency_ms || 0;
      const u = p.usage || {};
      current = el("div", { class: "panel step" },
        el("div", { class: "step-head" },
          el("strong", {}, `Step ${p.step}`),
          `${p.provider || "?"} · ${p.latency_ms ?? "?"} ms · ` +
          `${u.prompt_tokens ?? "?"} in / ${u.completion_tokens ?? "?"} out tokens · ${fmtCost(p.cost_usd)}`),
        p.text ? el("p", { class: "model-text" }, p.text) : null);
      blocks.push(current);
    } else if (event === "tool_result" && current) {
      const r = p.result || {};
      if (p.name === "check_match" && r.ok) r.results.forEach((x) => { titles[x.offer_id] = x.title; });
      current.append(el("div", { class: "call" },
        p.name ? el("code", {}, `${p.name}(${fmtArgs(p.arguments)})`)
               : el("code", {}, "no tool call"),
        resultView(p.name, r)));
    } else if (event === "model_error") {
      blocks.push(el("div", { class: "panel step" },
        el("span", { class: "badge err" }, "model error"), " ", p.error));
    }
  }

  const reason = end ? end.payload.stop_reason : null;
  const badge = !end
    ? el("span", { class: "badge warn" }, el("span", { class: "spinner" }), live ? " running" : " incomplete")
    : el("span", { class: "badge " + (reason === "final_answer" ? "ok" : "warn") }, reason);
  const summary = el("div", { class: "panel" },
    el("div", { class: "summary" },
      badge,
      el("div", { class: "stat" }, el("b", {}, steps), el("span", {}, "steps")),
      el("div", { class: "stat" }, el("b", {}, fmtCost(end ? end.payload.total_cost_usd : cost)), el("span", {}, "cost")),
      el("div", { class: "stat" }, el("b", {}, `${((end ? end.payload.total_model_latency_ms : latency) / 1000).toFixed(1)} s`), el("span", {}, "model time")),
      start ? el("div", { class: "stat" }, el("b", {}, start.payload.model), el("span", {}, "model")) : null),
    start ? el("p", { class: "goal" }, "Goal: " + start.payload.goal) : null);

  const out = [summary];
  const final = end && end.payload.final_answer;
  if (final) {
    out.push(el("div", { class: "panel final" },
      el("h3", {}, "Final answer"),
      el("div", { class: "chips" }, final.recommended_offer_ids.length
        ? final.recommended_offer_ids.map((id) => el("span", { class: "chip" }, titles[id] ? `${id} · ${titles[id]}` : id))
        : el("span", { class: "note" }, "No offers recommended.")),
      final.skills_to_learn.length
        ? el("div", {}, el("div", { class: "note", style: "margin-top:10px" }, "Skills to learn"),
            el("div", { class: "chips" }, final.skills_to_learn.map((s) => el("span", { class: "chip" }, s))))
        : null,
      el("p", {}, final.summary)));
  }
  view.replaceChildren(el("div", { style: "display:flex;flex-direction:column;gap:12px" }, out, blocks));
}

$("run").onclick = async () => {
  const message = $("message");
  message.hidden = true;
  $("run").disabled = true;
  try {
    const run = await getJSON("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal: $("goal").value, max_steps: Number($("max-steps").value) }),
    });
    openTrace(run.folder, run.name, true);
  } catch (error) {
    message.textContent = error.message;
    message.hidden = false;
    $("run").disabled = false;
  }
};

(async () => {
  const defaults = await getJSON("/api/defaults");
  $("goal").value = defaults.goal;
  $("max-steps").value = defaults.max_steps;
  $("max-steps").max = defaults.max_steps_cap;
  loadList();
})();
</script>
</body>
</html>
